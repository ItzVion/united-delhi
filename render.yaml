services:
  - type: web
    name: united-delhi
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DTC_API_KEY
        sync: false
      - key: PORT
        value: "10000"
