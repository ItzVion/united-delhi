services:
  - type: web
    name: united-delhi
    runtime: node
    rootDir: ""
    buildCommand: cd server && npm ci
    startCommand: cd server && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DTC_API_KEY
        sync: false
      - key: PORT
        value: "10000"
      - key: APP_ORIGINS
        value: "https://united-delhi.vercel.app"
