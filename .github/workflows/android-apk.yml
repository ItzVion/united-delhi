name: Build Android APK (one-time)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: united-delhi-apk-build
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Verify app typecheck and tests
        working-directory: app
        run: |
          npm run typecheck
          npm test

      - name: Install backend dependencies and check
        working-directory: server
        run: |
          npm ci
          npm run check
          npm test

      - name: Install web dependencies and verify
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm run build

      - name: Generate Android project
        working-directory: app
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_BASE_URL: https://united-delhi-api.onrender.com
        run: npx expo prebuild --clean --platform android --no-install

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew --no-daemon --stacktrace app:assembleRelease

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          apk="app/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          sha256sum "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: united-delhi-android-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
