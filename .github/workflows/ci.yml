name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    defaults:
      run:
        working-directory: app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Report dependency advisories (non-blocking)
        run: npm audit --json > audit-report.json || true
        working-directory: app
      - name: Upload app dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: app-dependency-audit-report
          path: app/audit-report.json
          if-no-files-found: error
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Report dependency advisories (non-blocking)
        run: npm audit --json > audit-report.json || true
      - name: Upload web dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: web-dependency-audit-report
          path: web/audit-report.json
          if-no-files-found: error
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: node --check scripts/import-dtc-static.mjs
      - name: Report production dependency advisories (non-blocking)
        run: npm audit --omit=dev --json > audit-report.json || true
      - name: Upload backend dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-audit-report
          path: server/audit-report.json
          if-no-files-found: error
          retention-days: 7
