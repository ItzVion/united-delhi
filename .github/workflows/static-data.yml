name: Static GTFS integrity and deploy gate

on:
  # The daily gate keeps timing reliable without running the database importer daily.
  # The importer runs only after 48 hours have elapsed since the last successful check.
  # 22:17 UTC is 03:47 Asia/Kolkata.
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: static-gtfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-import-and-deploy:
    name: Verify or repair Neon static data, then deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: server
    steps:
      - name: Enforce 48-hour interval
        id: interval
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::This workflow must run from main."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: proceeding immediately."
            exit 0
          fi

          last_verified="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | map(select(.name == "static-data-verification-marker" and .expired == false)) | sort_by(.created_at) | last | .created_at // empty')"

          if [[ -z "$last_verified" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "No successful verification marker found; proceeding."
            exit 0
          fi

          last_epoch="$(date -u -d "$last_verified" +%s)"
          now_epoch="$(date -u +%s)"
          elapsed=$((now_epoch - last_epoch))
          interval=172800

          if (( elapsed >= interval )); then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "At least 48 hours have elapsed; checking the reviewed DTC archive."
          else
            remaining=$((interval - elapsed))
            hours=$((remaining / 3600))
            minutes=$(((remaining % 3600) / 60))
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping this daily gate; approximately ${hours}h ${minutes}m remain before the next 48-hour check."
          fi

      - name: Check out this main-branch revision
        if: steps.interval.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.interval.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install importer dependencies
        if: steps.interval.outputs.should_run == 'true'
        run: npm ci

      - name: Check server syntax and run tests
        if: steps.interval.outputs.should_run == 'true'
        run: npm run check && npm test

      - name: Verify or repair DTC static data in Neon
        if: steps.interval.outputs.should_run == 'true'
        id: static
        run: npm run ensure:dtc
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DTC_STATIC_FILE: ./data/delhi_buses_static_gtfs_v1.zip
          DTC_STATIC_SOURCE_KEY: united-delhi-github-dtc-v1
          DTC_STATIC_EXPECTED_SHA256: b5940afdaf6154880ec5652fd3e8465dd9183b68477c7c71a287685e0ef91ff8
          DTC_STATIC_ALLOW_REPLACEMENT: "true"
          DTC_ALLOW_EXPIRED_CALENDAR: "false"
          DTC_ALLOW_INVALID_CALENDAR: "false"

      - name: Record successful verification time
        if: steps.interval.outputs.should_run == 'true'
        run: echo "Verified at $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > static-data-verification-marker.txt

      - name: Save successful verification marker
        if: steps.interval.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: static-data-verification-marker
          path: server/static-data-verification-marker.txt
          retention-days: 90
          if-no-files-found: error

      - name: Trigger Render deployment after a verified data change
        if: steps.interval.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' || steps.static.outputs.changed == 'true')
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::GitHub Actions secret RENDER_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
