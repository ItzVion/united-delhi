name: Refresh dependency locks

on:
  push:
    branches: [main]
    paths:
      - package.json
      - server/package.json

permissions:
  contents: write

concurrency:
  group: dependency-lock-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Refresh root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Refresh server lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Audit dependencies
        run: |
          npm ci
          npm audit --audit-level=high
          cd server
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json server/package-lock.json
          git diff --cached --quiet || git commit -m "chore: refresh dependency lockfiles"
          git push
