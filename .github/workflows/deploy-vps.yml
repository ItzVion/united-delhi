name: Debounced VPS backend deploy

on:
  push:
    branches: [main]
    paths:
      - "server/**"
  workflow_dispatch:

permissions:
  contents: read

# Keep one active run and one newest pending run. A newer pending run replaces
# the older pending run; the active run finishes its 20-second quiet check.
concurrency:
  group: united-delhi-vps-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Wait 20 seconds and coalesce server changes
        id: debounce
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          event_tree="$(git rev-parse "${GITHUB_SHA}:server")"
          latest_tree="$(git rev-parse "refs/remotes/origin/main:server")"
          if [[ "$event_tree" != "$latest_tree" ]]; then
            echo "::notice::A newer server/ snapshot superseded this run; skipping this deployment."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          release_sha="$(git rev-parse refs/remotes/origin/main)"
          git checkout --detach "$release_sha"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Selected source commit: $release_sha"

      - name: Verify VPS secrets are configured
        if: steps.debounce.outputs.skip != 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Set up Node.js 22 and verify backend
        if: steps.debounce.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install and test backend before deployment
        if: steps.debounce.outputs.skip != 'true'
        working-directory: server
        run: |
          npm ci
          npm run check
          npm test

      - name: Configure verified SSH connection
        if: steps.debounce.outputs.skip != 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          port="${VPS_SSH_PORT:-22}"
          echo "VPS_SSH_PORT=$port" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          ssh -i "$HOME/.ssh/id_ed25519" -p "$port" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" 'test -d /opt/united-delhi/releases && test -w /opt/united-delhi/releases'

      - name: Upload isolated release
        if: steps.debounce.outputs.skip != 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          RELEASE_SHA: ${{ steps.debounce.outputs.release_sha }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -p "$VPS_SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "install -d -m 0755 '/opt/united-delhi/releases/$RELEASE_SHA'"
          rsync -az --delete --exclude='.env' --exclude='.env.*' --exclude='node_modules/' \
            -e "ssh -i $HOME/.ssh/id_ed25519 -p $VPS_SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            server/ "$VPS_USER@$VPS_HOST:/opt/united-delhi/releases/$RELEASE_SHA/"

      - name: Install, test and activate release with rollback
        if: steps.debounce.outputs.skip != 'true'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          RELEASE_SHA: ${{ steps.debounce.outputs.release_sha }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "$VPS_SSH_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" "bash -s -- '$RELEASE_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          release="/opt/united-delhi/releases/$1"
          test -f "$release/package.json"
          node_major="$(node -p 'process.versions.node.split(".")[0]')"
          if [[ "$node_major" != "22" ]]; then
            echo "VPS must run Node.js 22; found $(node --version)." >&2
            exit 1
          fi

          cd "$release"
          npm ci --omit=dev
          npm run check
          npm test

          previous="$(readlink -f /opt/united-delhi/current 2>/dev/null || true)"
          ln -sfn "$release" /opt/united-delhi/current.next
          mv -Tf /opt/united-delhi/current.next /opt/united-delhi/current
          sudo -n /usr/bin/systemctl restart united-delhi

          healthy=false
          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 8 http://127.0.0.1:10000/health >/dev/null &&
               curl -fsS --max-time 8 http://127.0.0.1:10000/api/status |
                 node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.exit(JSON.parse(s).database==="OK"?0:1)}catch{process.exit(1)}})'; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [[ "$healthy" != "true" ]]; then
            echo "New release failed its local health/database check; rolling back." >&2
            if [[ -n "$previous" && -d "$previous" ]]; then
              ln -sfn "$previous" /opt/united-delhi/current.next
              mv -Tf /opt/united-delhi/current.next /opt/united-delhi/current
              sudo -n /usr/bin/systemctl restart united-delhi
            else
              sudo -n /usr/bin/systemctl stop united-delhi || true
            fi
            exit 1
          fi

          echo "Release activated: $release"
          curl -fsS http://127.0.0.1:10000/api/status
          current="$(readlink -f /opt/united-delhi/current)"
          count=0
          while IFS= read -r candidate; do
            count=$((count + 1))
            if [[ "$count" -gt 5 && "$candidate" != "$current" && "$candidate" != "$previous" ]]; then
              rm -rf -- "$candidate"
            fi
          done < <(find /opt/united-delhi/releases -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-)
          REMOTE
