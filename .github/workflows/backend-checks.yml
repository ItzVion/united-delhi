name: Backend auto-deploy

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: united-delhi-backend-main-deploy
  cancel-in-progress: false

jobs:
  backend:
    name: Check and deploy backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Initialize complete logs
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/backend-logs"
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Ref: $GITHUB_REF"
            echo "Commit: $GITHUB_SHA"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            date -u +"Started UTC: %Y-%m-%dT%H:%M:%SZ"
          } | tee "$GITHUB_WORKSPACE/backend-logs/run-info.log"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$GITHUB_WORKSPACE/backend-logs/npm-ci.log"

      - name: Check backend syntax
        working-directory: server
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "$GITHUB_WORKSPACE/backend-logs/syntax-check.log"

      - name: Run backend tests
        working-directory: server
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$GITHUB_WORKSPACE/backend-logs/backend-tests.log"

      - name: Deploy latest main on the VPS
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          LOG="$GITHUB_WORKSPACE/backend-logs/vps-deploy.log"
          if [[ -z "${VPS_SSH_HOST:-}" || -z "${VPS_SSH_PRIVATE_KEY:-}" || -z "${VPS_SSH_KNOWN_HOSTS:-}" ]]; then
            {
              echo "Deployment credentials are missing."
              echo "Configure repository Actions secrets: VPS_SSH_HOST, VPS_SSH_PRIVATE_KEY, VPS_SSH_KNOWN_HOSTS."
              echo "See server/deploy/GITHUB_ACTIONS_SETUP.md for setup steps."
            } | tee "$LOG"
            exit 1
          fi

          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/united-delhi-deploy"
          chmod 0600 "$HOME/.ssh/united-delhi-deploy"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

          {
            echo "Connecting to VPS as uddeploy@$VPS_SSH_HOST"
            echo "Requesting the existing main-only deployment script."
            ssh -i "$HOME/.ssh/united-delhi-deploy" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=20 \
              "uddeploy@$VPS_SSH_HOST" \
              'AUTODEPLOY_ENABLED=1 API_DEPLOY_ENABLED=1 WEB_DEPLOY_ENABLED=0 ANDROID_BUILD_ENABLED=0 UD_API_BASE_URL=https://ud-api.mangotyping.fun /opt/united-delhi/repo/server/deploy/vps-autodeploy.sh'
          } 2>&1 | tee "$LOG"

      - name: Upload complete build and deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: united-delhi-backend-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend-logs/
          if-no-files-found: warn
          retention-days: 30

  discord-failure-alert:
    name: Notify Discord on failure
    runs-on: ubuntu-latest
    needs: backend
    if: ${{ always() && needs.backend.result == 'failure' }}
    timeout-minutes: 2
    steps:
      - name: Send failure alert with downloadable logs link
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACTS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPOSITORY_NAME: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DISCORD_WEBHOOK_URL:-}" ]]; then
            echo "::error::DISCORD_WEBHOOK_URL is not configured. Add it under repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          python3 - <<'PY' > "$RUNNER_TEMP/discord-payload.json"
          import json, os
          run_url = os.environ["RUN_URL"]
          artifacts_url = os.environ["ARTIFACTS_URL"]
          commit = os.environ["COMMIT_SHA"]
          branch = os.environ["BRANCH_NAME"]
          repo = os.environ["REPOSITORY_NAME"]
          message = (
              "🚨 **United Delhi backend build/deployment failed**\n"
              f"**Repository:** {repo}\n"
              f"**Branch:** {branch}\n"
              f"**Commit:** `{commit[:12]}`\n"
              f"**Run log:** {run_url}\n"
              f"**Download complete logs (ZIP):** {artifacts_url}\n"
              "The artifact includes dependency installation, syntax checks, backend tests, and VPS deployment output where available."
          )
          print(json.dumps({"content": message, "allowed_mentions": {"parse": []}}))
          PY

          curl --fail --silent --show-error --retry 2 --retry-all-errors \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/discord-payload.json" \
            "$DISCORD_WEBHOOK_URL"
