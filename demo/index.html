<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>United Delhi — Live Bus Test</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9T/miYzoHS5obTRR9BMY="
    crossorigin="">
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#fff}
    #map{height:100%;width:100%}
    .panel{position:absolute;z-index:1000;top:16px;left:16px;width:min(420px,calc(100% - 32px));background:rgba(12,17,32,.94);border:1px solid #27304a;border-radius:16px;padding:14px;box-shadow:0 12px 40px #0008;backdrop-filter:blur(10px)}
    .title{font-size:20px;font-weight:800}.sub{font-size:12px;color:#9ca8c4;margin-top:3px}
    .row{display:flex;gap:8px;margin-top:12px}.row input{flex:1;min-width:0;background:#151d32;border:1px solid #303b59;color:#fff;border-radius:10px;padding:11px 12px;outline:none}
    button{border:0;border-radius:10px;padding:10px 13px;background:#3b82f6;color:white;font-weight:700;cursor:pointer}button.secondary{background:#202a43}
    .stats{display:flex;gap:8px;margin-top:10px}.stat{flex:1;background:#151d32;border-radius:10px;padding:9px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#94a3b8}
    .status{margin-top:9px;font-size:12px;color:#aab6d0}.legend{margin-top:9px;font-size:11px;color:#8490aa}
    .bus-label{font-size:10px;font-weight:800;white-space:nowrap;color:#fff;text-shadow:0 1px 3px #000}
    @media(max-width:600px){.panel{top:10px;left:10px;width:calc(100% - 20px)}}
  </style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <div class="title">🚌 United Delhi — Live Test</div>
  <div class="sub">Realtime DTC vehicles • no stops/static GTFS</div>
  <div class="row">
    <input id="search" placeholder="Search route ID, e.g. 1010">
    <button id="clear">Clear</button>
    <button id="refresh">↻</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="count">—</b><span>buses shown</span></div>
    <div class="stat"><b id="routes">—</b><span>route IDs</span></div>
  </div>
  <div class="status" id="status">Loading realtime data…</div>
  <div class="legend">Click a bus for vehicle ID, route ID, coordinates and timestamp.</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<script>
  const map = L.map('map', { preferCanvas: true }).setView([28.6139, 77.2090], 10);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const layer = L.layerGroup().addTo(map);
  let allVehicles = [];

  const $ = id => document.getElementById(id);
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

  function render() {
    layer.clearLayers();
    const q = $('search').value.trim().toLowerCase();
    const filtered = q
      ? allVehicles.filter(v => String(v.routeId ?? '').toLowerCase().includes(q) || String(v.id ?? '').toLowerCase().includes(q))
      : allVehicles;

    const routeIds = new Set(filtered.map(v => v.routeId).filter(Boolean));
    $('count').textContent = filtered.length.toLocaleString();
    $('routes').textContent = routeIds.size.toLocaleString();

    for (const v of filtered) {
      const circle = L.circleMarker([v.latitude, v.longitude], {
        radius: 4,
        stroke: false,
        fillOpacity: 0.9
      });
      circle.bindPopup(
        '<b>🚌 Vehicle ' + escapeHtml(v.id) + '</b><br>' +
        'Route ID: <b>' + escapeHtml(v.routeId || 'unknown') + '</b><br>' +
        'Trip: ' + escapeHtml(v.tripId || 'unknown') + '<br>' +
        'Speed: ' + escapeHtml(v.speedMps ?? 0) + ' m/s<br>' +
        'Position: ' + Number(v.latitude).toFixed(6) + ', ' + Number(v.longitude).toFixed(6) + '<br>' +
        'Observed: ' + escapeHtml(v.observedAt)
      );
      circle.addTo(layer);
    }

    $('status').textContent = q
      ? 'Showing ' + filtered.length.toLocaleString() + ' vehicles matching "' + q + '".'
      : 'Showing all realtime vehicles. Auto-refresh: 30s.';
  }

  async function load() {
    $('status').textContent = 'Fetching realtime DTC vehicles…';
    try {
      const response = await fetch('/api/realtime/vehicles', { cache: 'no-store' });
      const data = await response.json();
      if (!response.ok || data.status !== 'OK') throw new Error(data.reason || 'Realtime API failed');
      allVehicles = Array.isArray(data.vehicles) ? data.vehicles : [];
      render();
    } catch (error) {
      $('status').textContent = 'Error: ' + error.message;
      $('count').textContent = '0';
      $('routes').textContent = '0';
    }
  }

  $('search').addEventListener('input', render);
  $('clear').addEventListener('click', () => { $('search').value = ''; render(); });
  $('refresh').addEventListener('click', load);
  load();
  setInterval(load, 30000);
</script>
</body>
</html>
