services:
  - type: web
    name: united-delhi-api
    runtime: node
    buildCommand: npm ci --prefix server && npm run --prefix server check && npm test --prefix server
    startCommand: node server/src/index.js
    healthCheckPath: /health
    autoDeploy: true
    plan: free
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: OTD_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: APP_ORIGINS
        value: "https://united-delhi.vercel.app"
