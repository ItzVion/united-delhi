<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0B746B">
  <meta name="description" content="United Delhi — live Delhi DTC bus tracking, routes, stops and trip planning.">
  <title>United Delhi — Delhi transit, made simple</title>
  <link rel="icon" href="https://raw.githubusercontent.com/ItzVion/united-delhi/main/assets/united-delhi-logo.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root{--bg:#f4f7f4;--surface:#fff;--surface2:#e7f3f0;--border:#d8e4e0;--text:#17312f;--muted:#667a76;--accent:#0b746b;--accent2:#f28c28;--ok:#16865b;--danger:#c43d3d;--shadow:0 10px 30px rgba(23,49,47,.08)}
    *{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
    button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .age{min-height:100vh;display:grid;place-items:center;padding:24px}.age-card{width:min(520px,100%);padding:36px;border:1px solid var(--border);border-radius:28px;background:var(--surface);box-shadow:var(--shadow)}
    .mark{width:58px;height:58px;border-radius:18px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:900;font-size:24px}.age h1{font-size:30px;margin:16px 0 4px}.age h2{font-size:21px;margin:28px 0 8px}.age p{color:var(--muted);line-height:1.6}.primary{border:0;border-radius:13px;background:var(--accent);color:#fff;font-weight:900;padding:13px 18px}.age .primary{width:100%;margin-top:16px}.small{font-size:12px;color:var(--muted);text-align:center}
    .shell{min-height:100vh;display:grid;grid-template-columns:270px 1fr}.sidebar{position:sticky;top:0;height:100vh;padding:24px 16px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 24px}.brand .mark{width:42px;height:42px;border-radius:13px;font-size:17px}.brand strong{font-size:16px;letter-spacing:.8px}.brand span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
    nav{display:grid;gap:5px}nav button{border:0;background:transparent;text-align:left;padding:12px;border-radius:12px;color:var(--muted);font-weight:800}nav button:hover,nav button.active{background:var(--surface2);color:var(--accent)}
    .side-status{margin-top:auto;padding:13px;border:1px solid var(--border);border-radius:15px;background:var(--bg);font-size:11px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
    main{min-width:0;padding:24px}.topbar{display:flex;gap:12px;align-items:center;margin-bottom:18px}.search{flex:1;display:flex;align-items:center;gap:8px;padding:0 14px;height:48px;border:1px solid var(--border);border-radius:15px;background:#fff}.search input{border:0;outline:0;flex:1;color:var(--text);background:transparent}.search button{border:0;background:transparent;color:var(--muted);font-size:20px}
    .page{max-width:1400px;margin:auto}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin:8px 0 16px}.eyebrow{font-size:10px;letter-spacing:1.2px;font-weight:900;color:var(--muted)}h1{font-size:30px;line-height:1.1;margin:5px 0}.sub{color:var(--muted);font-size:13px}
    .status{padding:8px 11px;border-radius:999px;background:var(--surface2);color:var(--accent);font-size:11px;font-weight:900;white-space:nowrap}
    .grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.8fr);gap:16px}.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 3px 15px rgba(23,49,47,.035);overflow:hidden}.card-pad{padding:16px}
    #map{height:520px;width:100%;background:#eef2f1}.map-wrap{position:relative}.map-badge{position:absolute;z-index:500;top:12px;left:12px;background:rgba(255,255,255,.95);padding:8px 10px;border-radius:11px;font-size:11px;font-weight:900;box-shadow:0 2px 10px rgba(0,0,0,.08)}
    .leaflet-control-zoom{border:0!important;box-shadow:0 2px 12px rgba(23,49,47,.16)!important}.leaflet-control-zoom a{border:0!important;color:var(--text)!important}
    .bus-label{font:900 10px system-ui,sans-serif;white-space:nowrap;border-radius:8px;padding:4px 6px;border:2px solid #fff;box-shadow:0 2px 7px rgba(23,49,47,.22)}
    .section-title{font-size:17px;font-weight:900;margin:0}.section-sub{font-size:11px;color:var(--muted);margin-top:3px}.list{display:grid;gap:8px;margin-top:12px}.item{border:1px solid var(--border);border-radius:14px;padding:12px;background:#fff;cursor:pointer}.item:hover{border-color:var(--accent)}.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.route-badge{min-width:56px;height:34px;padding:0 9px;border-radius:10px;display:grid;place-items:center;font-weight:900}.meta{font-size:10px;color:var(--muted);margin-top:3px}.arrow{font-size:22px;color:var(--muted)}
    .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.action{padding:13px;border:1px solid var(--border);background:#fff;border-radius:15px;text-align:left}.action strong{display:block;font-size:12px}.action span{font-size:10px;color:var(--muted)}
    .panel{max-width:1100px;margin:auto}.back{border:0;background:transparent;color:var(--accent);font-weight:900;padding:0;margin-bottom:15px}.detail-head{display:flex;align-items:center;gap:13px;margin-bottom:14px}.big-route{min-width:78px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:20px;font-weight:900}.detail-head h2{margin:0;font-size:22px}.detail-head p{margin:3px 0;color:var(--muted);font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mini-map{height:310px}.stops{max-height:430px;overflow:auto}.stop-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}.seq{width:28px;color:var(--muted);font-size:10px;padding-top:3px}.stop-row strong{font-size:12px}.bus-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}.live{font-size:9px;font-weight:900;letter-spacing:.8px;color:var(--ok)}
    .form{padding:16px;border:1px solid var(--border);background:#fff;border-radius:18px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:9px;font-weight:900;letter-spacing:1px;color:var(--muted)}.field input{height:44px;border:1px solid var(--border);border-radius:12px;padding:0 12px;outline:0}.field input:focus{border-color:var(--accent)}.result-card{padding:15px;border:1px solid var(--border);border-radius:17px;background:#fff;margin-top:10px}.route-line{font-size:12px;color:var(--muted);margin-top:6px}.empty{padding:30px;text-align:center;color:var(--muted)}
    .legal{line-height:1.7;color:var(--muted);font-size:13px}.legal h2{color:var(--text)}.notice{padding:12px;border-radius:13px;background:var(--surface2);font-size:11px;color:var(--text)}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--border);padding:10px 12px}.brand{padding:4px 6px 10px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}.side-status{display:none}main{padding:14px}.grid,.two{grid-template-columns:1fr}.hero{align-items:flex-start}.actions{grid-template-columns:1fr 1fr 1fr}#map{height:430px}}
    @media(max-width:560px){.actions{grid-template-columns:1fr}.topbar{margin-bottom:10px}.hero{display:block}.status{display:inline-block;margin-top:10px}.age-card{padding:25px}}
  </style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const API='https://united-delhi.de.deplexo.com';
const app=document.getElementById('app');
const colors={accent:'#0b746b',accentSoft:'#ddf1ed',secondary:'#f28c28',secondarySoft:'#fff0de',success:'#16865b',text:'#17312f',muted:'#667a76',surface:'#fff',border:'#d8e4e0'};
let map=null, mapLayers=[], vehicles=[], currentView='home', selectedRoute=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const routeName=s=>{let x=String(s||'').trim().replace(/(?:UP|DOWN|DWN)$/i,'').replace(/^AIR-0+/i,'AIR-');return x||'Bus'};
const routeColor=(name)=>{const p=['#0b746b','#f28c28','#16865b','#6b5bb5','#2f6f9f','#b84a62','#7b6f34'];let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))%p.length;const bg=p[h];return {bg,text:['#f28c28','#b84a62','#7b6f34'].includes(bg)?'#fff':'#fff'}};
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{accept:'application/json','content-type':'application/json',...(opt.headers||{})}});const b=await r.json();if(!r.ok)throw Error(b.reason||'Request failed');return b}
function ageGate(){app.innerHTML='<div class="age"><div class="age-card"><div class="mark">UD</div><h1>United Delhi</h1><h2>Before you continue</h2><p>The current production service is limited to people aged 18 or older because the app can process location and other online request data.</p><p>If you are under 18, please do not continue to the production service. A future version may support younger users after a legally appropriate parental-consent system is implemented.</p><button class="primary" id="enter">I am 18 or older</button><p class="small">Your age is not saved by this screen.</p></div></div>';document.getElementById('enter').onclick=()=>{sessionStorage.setItem('ud-age','1');renderShell('home')}}
function renderShell(view){currentView=view;app.innerHTML='<div class="shell"><aside class="sidebar"><div class="brand"><div class="mark">UD</div><div><strong>UNITED DELHI</strong><span>Delhi transit, made simple</span></div></div><nav>'+[['home','⌂','Home'],['search','⌕','Search'],['planner','↗','Plan trip'],['nearby','●','Nearby'],['legal','§','Legal']].map(x=>'<button data-view="'+x[0]+'">'+x[1]+' &nbsp; '+x[2]+'</button>').join('')+'</nav><div class="side-status"><span class="dot"></span><span id="sideStatus">Checking live data…</span></div></aside><main><div class="topbar"><div class="search"><span>⌕</span><input id="globalSearch" placeholder="Search routes, stops or places"><button id="globalGo">↵</button></div></div><div id="content"></div></main></div>';document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>renderShell(b.dataset.view));document.getElementById('globalGo').onclick=()=>goSearch();document.getElementById('globalSearch').onkeydown=e=>{if(e.key==='Enter')goSearch()};renderView(view);refreshStatus()}
function goSearch(){const q=document.getElementById('globalSearch').value.trim();renderShell('search');if(q){document.getElementById('searchInput').value=q;doSearch(q)}}
async function refreshStatus(){try{const s=await api('/api/status');const el=document.getElementById('sideStatus');if(el)el.textContent=s.realtimeCache==='OK'?'Live DTC data online':'Live data unavailable'}catch{const el=document.getElementById('sideStatus');if(el)el.textContent='API unavailable'}}
function renderView(view){currentView=view;const c=document.getElementById('content');if(!c)return;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));({home:homeView,search:searchView,planner:plannerView,nearby:nearbyView,legal:legalView}[view]||homeView)(c)}
function homeView(c){c.innerHTML='<div class="page"><div class="hero"><div><div class="eyebrow">LIVE TRANSIT</div><h1>Delhi transit, made simple.</h1><div class="sub">Track DTC buses, explore routes and find nearby stops.</div></div><div class="status" id="liveStatus">Loading live buses…</div></div><div class="grid"><div class="card map-wrap"><div id="map"></div><div class="map-badge" id="mapBadge">Live map</div></div><div><div class="actions"><button class="action" onclick="renderShell(\'search\')"><strong>⌕ Search</strong><span>Routes & stops</span></button><button class="action" onclick="renderShell(\'planner\')"><strong>↗ Plan trip</strong><span>Find buses</span></button><button class="action" onclick="renderShell(\'nearby\')"><strong>● Nearby</strong><span>Around you</span></button></div><div class="card card-pad" style="margin-top:12px"><div class="section-title">Nearby stops</div><div class="section-sub">Use your location to find stops around you.</div><div id="nearbyHome" class="list"><div class="empty">Finding nearby stops…</div></div></div></div></div></div>';initMap('map');loadVehicles();loadNearbyHome()}
async function initMap(id){if(map){map.remove();map=null}map=L.map(id,{preferCanvas:true,zoomControl:true}).setView([28.6139,77.209],11.7);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map)}
function clearMap(){mapLayers.forEach(x=>x.remove());mapLayers=[]}
function addBusMarkers(list){if(!map)return;clearMap();list.slice(0,220).forEach(v=>{const n=routeName(v.routeShortName),c=routeColor(n);const icon=L.divIcon({className:'',html:'<div class="bus-label" style="background:'+c.bg+';color:'+c.text+'">'+esc(n)+'</div>',iconSize:[60,25],iconAnchor:[30,12]});const m=L.marker([v.latitude,v.longitude],{icon}).addTo(map);m.on('click',()=>routeDetail(v.routeId,n));mapLayers.push(m)});if(list.length)map.fitBounds(L.latLngBounds(list.slice(0,220).map(v=>[v.latitude,v.longitude])),{padding:[30,30],maxZoom:12.5})}
async function loadVehicles(){try{const r=await api('/api/realtime/vehicles');vehicles=r.vehicles||[];document.getElementById('liveStatus').textContent=vehicles.length+' live buses';document.getElementById('mapBadge').textContent=vehicles.length+' buses live';addBusMarkers(vehicles)}catch{document.getElementById('liveStatus').textContent='Live data unavailable'}}
async function loadNearbyHome(){const box=document.getElementById('nearbyHome');if(!navigator.geolocation){box.innerHTML='<div class="empty">Location is unavailable in this browser.</div>';return}navigator.geolocation.getCurrentPosition(async p=>{try{const r=await api('/api/stops/nearby',{method:'POST',body:JSON.stringify({lat:p.coords.latitude,lon:p.coords.longitude,limit:5})});box.innerHTML=(r.stops||[]).map(s=>'<div class="item" onclick="stopDetail(\''+esc(s.stop_id)+'\',\''+esc(s.name)+'\')"><div class="row"><div class="grow"><strong>'+esc(s.name)+'</strong><div class="meta">'+Math.round(s.distance_m||0)+' m away</div></div><span class="arrow">›</span></div></div>').join('')||'<div class="empty">No nearby stops found.</div>';if(map)map.setView([p.coords.latitude,p.coords.longitude],13)}catch{box.innerHTML='<div class="empty">Nearby stops are temporarily unavailable.</div>'}},()=>{box.innerHTML='<div class="empty">Allow location access to find nearby stops.</div>'},{enableHighAccuracy:false,maximumAge:300000,timeout:10000})}
function searchView(c){c.innerHTML='<div class="panel"><div class="hero"><div><div class="eyebrow">FIND YOUR BUS</div><h1>Search</h1><div class="sub">Search routes, stops and destinations.</div></div></div><div class="form"><div class="field"><label>SEARCH</label><input id="searchInput" placeholder="Route number, stop or place" autocomplete="off"></div><button class="primary" onclick="doSearch(document.getElementById(\'searchInput\').value)">Search</button></div><div id="searchResults"></div></div>'}
async function doSearch(q){q=String(q||'').trim();const box=document.getElementById('searchResults');if(q.length<2){box.innerHTML='<div class="empty">Type at least 2 characters.</div>';return}box.innerHTML='<div class="empty">Searching…</div>';try{const r=await api('/api/search?q='+encodeURIComponent(q));const results=r.results||[];box.innerHTML=results.length?results.map(x=>x.type==='route'?'<div class="result-card" onclick="routeDetail(\''+esc(x.id)+'\',\''+esc(x.label)+'\')"><div class="row"><div class="route-badge" style="background:'+routeColor(routeName(x.label)).bg+';color:#fff">'+esc(routeName(x.label))+'</div><div class="grow"><strong>Bus route</strong><div class="route-line">'+esc(x.fromStop||'Starting stop')+' → '+esc(x.toStop||'Ending stop')+'</div></div><span class="arrow">›</span></div></div>':'<div class="result-card" onclick="stopDetail(\''+esc(x.id)+'\',\''+esc(x.label)+'\')"><div class="row"><div class="grow"><strong>'+esc(x.label)+'</strong><div class="meta">Bus stop</div></div><span class="arrow">›</span></div></div>').join(''):'<div class="empty">Nothing found. Try another route number or stop name.</div>'}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function backButton(){return '<button class="back" onclick="renderShell(\'home\')">‹ Back</button>'}
async function routeDetail(id,label){renderShell('detail');const c=document.getElementById('content');c.innerHTML='<div class="panel">'+backButton()+'<div class="empty">Loading route…</div></div>';try{const r=await api('/api/routes/'+encodeURIComponent(id));const route=r.route,stops=r.stops||[],buses=r.vehicles||[];const n=routeName(route.short_name||label),col=routeColor(n);c.innerHTML='<div class="panel">'+backButton()+'<div class="detail-head"><div class="big-route" style="background:'+col.bg+';color:#fff">'+esc(n)+'</div><div><h2>'+esc(route.fromStop||'Starting stop')+' → '+esc(route.toStop||'Destination')+'</h2><p>'+stops.length+' stops · '+buses.length+' live buses</p></div></div><div class="two"><div class="card map-wrap"><div id="detailMap" class="mini-map"></div></div><div class="card card-pad"><div class="section-title">Live buses</div><div class="section-sub">Current vehicles on this exact route variant.</div><div class="stops" id="busList">'+(buses.length?buses.map(v=>'<div class="bus-row"><div class="route-badge" style="background:'+col.bg+';color:#fff">'+esc(n)+'</div><div class="grow"><strong>'+esc(v.id)+'</strong><div class="meta">To '+esc(v.toStop||route.toStop||'Destination')+' · '+freshness(v.observedAt)+'</div></div><span class="live">LIVE</span></div>').join(''):'<div class="empty">No live buses on this route right now.</div>')+'</div></div></div><div class="card card-pad" style="margin-top:14px"><div class="section-title">Stops</div><div class="section-sub">Ordered stops for this route direction.</div><div class="stops">'+stops.map((s,i)=>'<div class="stop-row"><div class="seq">'+(i+1)+'</div><div class="grow"><strong>'+esc(s.name)+'</strong><div class="meta">'+esc(s.stop_id)+'</div></div></div>').join('')+'</div></div></div>';initDetailMap('detailMap',stops,buses)}catch(e){c.innerHTML='<div class="panel">'+backButton()+'<div class="empty">'+esc(e.message)+'</div></div>'}}
function initDetailMap(id,stops,buses){if(map){map.remove();map=null}map=L.map(id,{zoomControl:true}).setView([28.6139,77.209],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const points=stops.map(s=>[s.latitude,s.longitude]);if(points.length){L.polyline(points,{color:'#0b746b',weight:4,opacity:.8}).addTo(map);stops.forEach((s,i)=>L.circleMarker([s.latitude,s.longitude],{radius:4,color:'#fff',weight:2,fillColor:'#0b746b',fillOpacity:1}).addTo(map).bindTooltip((i+1)+'. '+s.name))}buses.forEach(v=>L.circleMarker([v.latitude,v.longitude],{radius:7,color:'#fff',weight:2,fillColor:'#f28c28',fillOpacity:1}).addTo(map).bindPopup('<b>'+esc(routeName(v.routeShortName))+'</b><br>Live bus '+esc(v.id)));if(points.length)map.fitBounds(L.latLngBounds(points),{padding:[20,20]})}
function stopDetail(id,name){
  renderShell('detail');
  const c=document.getElementById('content');
  c.innerHTML='<div class="panel">'+backButton()+'<div class="empty">Loading stop…</div></div>';
  Promise.all([
    api('/api/stops/'+encodeURIComponent(id)),
    api('/api/stops/'+encodeURIComponent(id)+'/arrivals')
  ]).then(([s,a])=>{
    const stop=s.stop;
    const arrivals=a.arrivals||[];
    const routeCards=(s.routes||[]).map(x=>'<div class="item" onclick="routeDetail(\\''+esc(x.route_id)+'\\')"><div class="row"><div class="route-badge" style="background:'+routeColor(routeName(x.short_name)).bg+';color:#fff">'+esc(routeName(x.short_name))+'</div><div class="grow"><strong>'+esc(x.fromStop||'Starting stop')+' → '+esc(x.toStop||'Destination')+'</strong></div><span class="arrow">›</span></div></div>').join('');
    const arrivalCards=arrivals.length?arrivals.map(v=>'<div class="bus-row"><div class="route-badge" style="background:#0b746b;color:#fff">'+esc(routeName(v.routeShortName))+'</div><div class="grow"><strong>To '+esc(v.toStop||'Destination')+'</strong><div class="meta">'+Math.round(v.distanceMeters||0)+' m away · '+freshnessSeconds(v.observedAgeSeconds)+'</div></div><span class="live">LIVE</span></div>').join(''):'<div class="empty">No live buses are currently close to this stop.</div>';
    c.innerHTML='<div class="panel">'+backButton()+'<div class="hero"><div><div class="eyebrow">BUS STOP</div><h1>'+esc(stop.name)+'</h1><div class="sub">'+esc(stop.stop_id)+'</div></div><div class="status">'+arrivals.length+' live arrivals</div></div><div class="two"><div class="card map-wrap"><div id="stopMap" class="mini-map"></div></div><div class="card card-pad"><div class="section-title">Live arrivals</div><div class="section-sub">Nearest live buses serving this stop.</div><div class="stops">'+arrivalCards+'</div></div></div><div class="card card-pad" style="margin-top:14px"><div class="section-title">Routes serving this stop</div><div class="list">'+routeCards+'</div></div></div>';
    if(map){map.remove();map=null}
    map=L.map('stopMap').setView([stop.latitude,stop.longitude],15);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
    L.marker([stop.latitude,stop.longitude]).addTo(map).bindPopup('<b>'+esc(stop.name)+'</b>').openPopup();
  }).catch(e=>{c.innerHTML='<div class="panel">'+backButton()+'<div class="empty">'+esc(e.message)+'</div></div>'});
}
function plannerView(c){c.innerHTML='<div class="panel"><div class="hero"><div><div class="eyebrow">TRIP PLANNER</div><h1>Plan your trip</h1><div class="sub">Find direct and one-change DTC journeys.</div></div></div><div class="form"><div class="field"><label>FROM</label><input id="from" placeholder="Starting stop or place"></div><div class="field"><label>TO</label><input id="to" placeholder="Destination stop or place"></div><button class="primary" onclick="doPlan()">Find buses</button></div><div id="planResults"></div></div>'}
async function doPlan(){const f=document.getElementById('from').value.trim(),t=document.getElementById('to').value.trim(),box=document.getElementById('planResults');if(!f||!t){box.innerHTML='<div class="empty">Enter both a starting point and destination.</div>';return}box.innerHTML='<div class="empty">Planning…</div>';try{const r=await api('/api/plan?from='+encodeURIComponent(f)+'&to='+encodeURIComponent(t));const opts=r.options||[];box.innerHTML=opts.length?opts.map(o=>'<div class="result-card"><div class="row"><div class="grow"><strong>'+esc(o.type==='direct'?'DIRECT BUS':'ONE CHANGE')+'</strong><div class="meta">'+esc(String(o.durationMinutes))+' min · Walk '+esc(String(o.walkingMinutes))+' min</div></div></div>'+(o.legs||[]).map(l=>'<div class="route-line"><b>'+esc(routeName(l.routeName))+'</b> · '+esc(l.fromStop)+' → '+esc(l.toStop)+'</div>').join('')+(o.transferStop?'<div class="meta">Change buses at '+esc(o.transferStop)+'</div>':'')+'</div>').join(''):'<div class="empty">'+esc(r.reason||'No journey options found.')+'</div>'}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function nearbyView(c){c.innerHTML='<div class="page"><div class="hero"><div><div class="eyebrow">AROUND YOU</div><h1>Nearby stops</h1><div class="sub">Use your browser location to find DTC stops near you.</div></div><button class="primary" onclick="loadNearbyPage()">Use my location</button></div><div class="card card-pad"><div id="nearbyList" class="list"><div class="empty">Press “Use my location” to begin.</div></div></div></div>'}
async function loadNearbyPage(){const box=document.getElementById('nearbyList');box.innerHTML='<div class="empty">Getting your location…</div>';if(!navigator.geolocation){box.innerHTML='<div class="empty">Geolocation is not supported by this browser.</div>';return}navigator.geolocation.getCurrentPosition(async p=>{try{const r=await api('/api/stops/nearby',{method:'POST',body:JSON.stringify({lat:p.coords.latitude,lon:p.coords.longitude,limit:30})});box.innerHTML=(r.stops||[]).map(s=>'<div class="item" onclick="stopDetail(\''+esc(s.stop_id)+'\',\''+esc(s.name)+'\')"><div class="row"><div class="grow"><strong>'+esc(s.name)+'</strong><div class="meta">'+Math.round(s.distance_m||0)+' m away</div></div><span class="arrow">›</span></div></div>').join('')||'<div class="empty">No nearby stops found.</div>'}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}},()=>{box.innerHTML='<div class="empty">Location permission was not granted.</div>'},{enableHighAccuracy:false,maximumAge:300000,timeout:10000})}
function legalView(c){c.innerHTML='<div class="panel"><div class="hero"><div><div class="eyebrow">UNITED DELHI</div><h1>Legal & privacy</h1></div></div><div class="card card-pad legal"><div class="notice">This web client uses the same production API and 18+ access restriction as the current mobile client.</div><h2>Location</h2><p>Location is used only when you choose to allow it, to find nearby DTC stops and centre the map. The browser may send reduced-precision coordinates to the backend for nearby-stop lookup.</p><h2>Live transit</h2><p>Live vehicle positions come from the official Delhi Open Transit Data integration through the United Delhi backend. Private API credentials are never placed in this website.</p><h2>Documents</h2><p><a href="https://github.com/ItzVion/united-delhi/blob/main/PRIVACY_POLICY.md" target="_blank" rel="noreferrer">Privacy Policy</a> · <a href="https://github.com/ItzVion/united-delhi/blob/main/TERMS_OF_SERVICE.md" target="_blank" rel="noreferrer">Terms of Service</a> · <a href="https://github.com/ItzVion/united-delhi/blob/main/SECURITY.md" target="_blank" rel="noreferrer">Security Policy</a></p><p class="small">Replace the repository's legal contact placeholder before any public production release.</p></div></div>'}
function freshness(x){const n=Date.parse(x);if(!Number.isFinite(n))return'Live position';const s=Math.max(0,Math.round((Date.now()-n)/1000));return freshnessSeconds(s)}
function freshnessSeconds(s){s=Number(s);return !Number.isFinite(s)?'Live position':s<60?'Updated just now':'Updated '+Math.floor(s/60)+' min ago'}
function start(){if(sessionStorage.getItem('ud-age')==='1')renderShell('home');else ageGate()}
start();
</script>
